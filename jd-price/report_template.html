<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京东价格分析报告</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --border: #d2d2d7;
            --accent: #0071e3;
            --green: #34c759;
            --yellow: #ff9500;
            --red: #ff3b30;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card-bg: #1c1c1e;
                --text: #f5f5f7;
                --text-secondary: #86868b;
                --border: #38383a;
                --shadow: 0 2px 12px rgba(0,0,0,0.3);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: contain;
            background: #f8f8f8;
            padding: 20px;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .current-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--red);
        }

        .original-price {
            font-size: 1rem;
            color: var(--text-secondary);
            text-decoration: line-through;
        }

        .discount-tag {
            display: inline-block;
            background: var(--red);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .stars {
            color: var(--yellow);
            font-size: 1.1rem;
        }

        .rating-count {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .shop-info {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .analysis-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .badge-good {
            background: rgba(52, 199, 89, 0.15);
            color: var(--green);
        }

        .badge-watch {
            background: rgba(255, 149, 0, 0.15);
            color: var(--yellow);
        }

        .badge-bad {
            background: rgba(255, 59, 48, 0.15);
            color: var(--red);
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .comparison-table th {
            background: var(--bg);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .comparison-table tr:hover {
            background: rgba(0, 113, 227, 0.05);
        }

        .recommendation {
            background: linear-gradient(135deg, #0071e3 0%, #005bb5 100%);
            color: white;
            border-radius: 16px;
            padding: 30px;
            margin-top: 20px;
        }

        .recommendation h3 {
            font-size: 1.5rem;
            margin-bottom: 16px;
        }

        .recommendation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .recommendation-item {
            background: rgba(255,255,255,0.15);
            padding: 16px;
            border-radius: 12px;
        }

        .recommendation-item .label {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .recommendation-item .value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .trend-chart {
            height: 200px;
            background: var(--bg);
            border-radius: 12px;
            margin-top: 16px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 20px;
        }

        .trend-bar {
            width: 30px;
            background: var(--accent);
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease;
        }

        .coupon-tag {
            display: inline-block;
            background: rgba(255, 59, 48, 0.1);
            color: var(--red);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin: 4px 4px 4px 0;
            border: 1px dashed var(--red);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .comparison-table {
                font-size: 0.85rem;
            }

            .comparison-table th,
            .comparison-table td {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 京东价格分析报告</h1>
            <p class="subtitle">生成时间：{{DATE}}</p>
        </div>

        <!-- 商品卡片区域 -->
        <div class="product-grid">
            {{PRODUCT_CARDS}}
        </div>

        <!-- 价格分析 -->
        <div class="card">
            <div class="card-title">📈 价格分析</div>
            {{ANALYSIS_CONTENT}}
        </div>

        <!-- 对比表（多商品时显示） -->
        {{COMPARISON_SECTION}}

        <!-- 价格趋势 -->
        <div class="card">
            <div class="card-title">📉 价格趋势（近30天）</div>
            <div class="trend-chart">
                {{TREND_BARS}}
            </div>
        </div>

        <!-- 推荐结论 -->
        <div class="recommendation">
            <h3>🏆 推荐结论</h3>
            <div class="recommendation-grid">
                {{RECOMMENDATIONS}}
            </div>
        </div>

        <div class="footer">
            <p>本报告由 JD Price Intelligence Skill 自动生成</p>
            <p>数据来源：京东商城 | 报告时间：{{DATE}}</p>
        </div>
    </div>
</body>
</html>
